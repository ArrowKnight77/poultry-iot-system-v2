events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 8080 default_server;
        include /etc/nginx/snippets/poultry-security-headers.conf;

        location = /ok {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /redirect {
            return 302 /ok;
        }

        location = /not-found {
            return 404;
        }
    }
}
