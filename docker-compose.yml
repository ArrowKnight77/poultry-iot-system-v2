networks:
  avicola-network:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    networks:
      - avicola-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    networks:
      - avicola-network
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/certs/broker:/mosquitto/certs/broker:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    networks:
      - avicola-network
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_URL: http://api:5000/lecturas
      API_BASE_URL: http://api:5000
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV}
      CORS_ORIGINS: ${CORS_ORIGINS}
      INGEST_API_KEY: ${INGEST_API_KEY}
      SECURITY_EVENTS_API_KEY: ${SECURITY_EVENTS_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-60}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      MFA_ISSUER: "${MFA_ISSUER:-Poultry IoT System}"
      MFA_CHALLENGE_EXPIRES_MINUTES: ${MFA_CHALLENGE_EXPIRES_MINUTES:-5}
      DASHBOARD_PROXY_KEY: "${DASHBOARD_PROXY_KEY}"
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_FAILURE_WINDOW_MINUTES: ${LOGIN_FAILURE_WINDOW_MINUTES:-15}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    networks:
      - avicola-network
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_BASE_URL: http://api:5000
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV}
      DASHBOARD_PROXY_KEY: "${DASHBOARD_PROXY_KEY}"
    restart: unless-stopped

  mqtt_subscriber:
    build:
      context: .
      dockerfile: Dockerfile.mqtt
    networks:
      - avicola-network
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      api:
        condition: service_started
    environment:
      API_URL: http://api:5000/lecturas
      MQTT_BROKER: mqtt
      MQTT_PORT: ${MQTT_PORT}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-true}
      MQTT_TLS_CA_CERT: /mosquitto/certs/ca.crt
      MQTT_TOPIC: ${MQTT_TOPIC}
      API_INGEST_KEY: ${INGEST_API_KEY}
      SECURITY_EVENTS_API_URL: http://api:5000/api/security-events/ingest
      SECURITY_EVENTS_API_KEY: ${SECURITY_EVENTS_API_KEY}
      MQTT_USERNAME: ${MQTT_SUBSCRIBER_USERNAME}
      MQTT_PASSWORD: ${MQTT_SUBSCRIBER_PASSWORD}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./mosquitto/certs/broker/ca.crt:/mosquitto/certs/ca.crt:ro
    restart: unless-stopped

volumes:
  postgres_data:
  mosquitto_data:
