# Versioned production virtual host for poultry-system.duckdns.org.
# TLS certificates and Certbot-managed TLS options remain on the host.

server {
    server_name poultry-system.duckdns.org;

    client_max_body_size 20M;

    # Keep all add_header directives in this server-level include. Adding an
    # add_header inside a location would disable normal parent inheritance.
    include /etc/nginx/snippets/poultry-security-headers.conf;

    # The browser uses the authenticated dashboard session for this view. Keep
    # the exact GET endpoint on the dashboard proxy; the longer
    # /api/security-events/ingest path continues to the API service below.
    location = /api/security-events {
        proxy_pass http://127.0.0.1:5001/api/security-events;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lecturas {
        proxy_pass http://127.0.0.1:5000/lecturas;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/poultry-system.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/poultry-system.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # HSTS must never be emitted by this clear-text redirect server.
    server_tokens off;

    if ($host = poultry-system.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name poultry-system.duckdns.org;
    return 404; # managed by Certbot
}
