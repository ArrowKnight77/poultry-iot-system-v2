{% extends 'base.html' %}
{% block title %}Acceso restringido{% endblock %}

{% block content %}
<div class="py-5 px-2 px-md-4">
  <div class="d-flex align-items-start gap-3 border-start border-danger border-4 bg-white p-4">
    <i class="bi bi-shield-lock text-danger fs-2" aria-hidden="true"></i>
    <div>
      <h3 class="mb-2" data-i18n="errors.forbidden_title">Acceso restringido</h3>
      <p class="text-muted mb-4" data-i18n="errors.forbidden_detail">Tu rol no tiene permiso para realizar esta acción o abrir esta vista.</p>
      <a href="/dashboard" class="btn btn-success">
        <i class="bi bi-arrow-left me-1"></i><span data-i18n="errors.back_dashboard">Volver al dashboard</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
