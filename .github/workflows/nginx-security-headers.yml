name: Nginx security headers validation

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - deploy/nginx/**
      - scripts/check_nginx_security_headers.sh
      - scripts/run_nginx_security_preview.sh
      - scripts/validate_nginx_config.sh
      - local_tests/fixtures/nginx/**
      - local_tests/test_nginx_security_headers.py
      - .github/workflows/nginx-security-headers.yml
  push:
    branches:
      - dev
      - main
    paths:
      - deploy/nginx/**
      - scripts/check_nginx_security_headers.sh
      - scripts/run_nginx_security_preview.sh
      - scripts/validate_nginx_config.sh
      - local_tests/fixtures/nginx/**
      - local_tests/test_nginx_security_headers.py
      - .github/workflows/nginx-security-headers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-security-headers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Nginx policy and response headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NGINX_TEST_IMAGE: nginx:1.24.0-alpine@sha256:77e5d4a6ad906c5d3793764085706577fa705b1dc6f244ea0241c4b5e2155385
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Nginx policy tests
        run: python -m unittest local_tests.test_nginx_security_headers

      - name: Check shell syntax
        run: >-
          bash -n
          scripts/check_nginx_security_headers.sh
          scripts/run_nginx_security_preview.sh
          scripts/validate_nginx_config.sh

      - name: Validate Nginx syntax and generated headers
        run: bash scripts/validate_nginx_config.sh
