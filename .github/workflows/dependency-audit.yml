name: Dependency vulnerability audit

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - requirements.in
      - requirements.txt
      - pyproject.toml
      - poetry.lock
      - .github/workflows/dependency-audit.yml
  push:
    branches:
      - dev
      - main
    paths:
      - requirements.in
      - requirements.txt
      - pyproject.toml
      - poetry.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "17 07 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_AUDIT_VERSION: "2.10.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  runtime-requirements:
    name: Audit runtime requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned audit tool
        run: python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit application runtime dependencies
        run: >-
          python -m pip_audit
          --requirement requirements.txt
          --vulnerability-service pypi
          --strict
          --format markdown
          --progress-spinner off

  simulator-project:
    name: Audit IoT simulator project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned audit tool
        run: python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit simulator project metadata
        run: >-
          python -m pip_audit
          .
          --vulnerability-service pypi
          --strict
          --format markdown
          --progress-spinner off
