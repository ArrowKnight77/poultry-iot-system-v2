name: Container hardening validation

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - Dockerfile.api
      - Dockerfile.dashboard
      - Dockerfile.mqtt
      - docker-compose.yml
      - requirements.txt
      - api_avicola/**
      - dashboard_avicola/**
      - local_tests/**
      - .github/workflows/container-hardening.yml
  push:
    branches:
      - dev
      - main
    paths:
      - Dockerfile.api
      - Dockerfile.dashboard
      - Dockerfile.mqtt
      - docker-compose.yml
      - requirements.txt
      - api_avicola/**
      - dashboard_avicola/**
      - local_tests/**
      - .github/workflows/container-hardening.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and inspect hardened images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build hardened images
        run: |
          docker build --file Dockerfile.api --tag poultry-hardening-api:test .
          docker build --file Dockerfile.dashboard --tag poultry-hardening-dashboard:test .
          docker build --file Dockerfile.mqtt --tag poultry-hardening-mqtt:test .

      - name: Inspect image security metadata
        run: |
          for image in \
            poultry-hardening-api:test \
            poultry-hardening-dashboard:test \
            poultry-hardening-mqtt:test
          do
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
            test "$(docker image inspect "$image" --format '{{if .Config.Healthcheck}}present{{end}}')" = "present"
          done

      - name: Run unit and policy tests
        run: >-
          docker run --rm
          --entrypoint python
          --volume "${{ github.workspace }}:/src:ro"
          --workdir /src
          poultry-hardening-api:test
          -m unittest discover -s local_tests -p "test_*.py"
